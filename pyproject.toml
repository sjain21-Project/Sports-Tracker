[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-tracker"
version = "1.0.0"
description = "Live terminal scoreboard for the NFL, NBA, NCAA, UFC, boxing and Sleeper fantasy football."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samyak Jain", email = "21jsamyak@gmail.com" }]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
sports-tracker = "sports_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["sports_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
